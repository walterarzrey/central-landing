<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" fill="none">
  <defs>
    <linearGradient id="bgPOS" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140C07"/>
      <stop offset="100%" stop-color="#24140C"/>
    </linearGradient>
    <linearGradient id="goldPOS" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6C55F"/>
      <stop offset="100%" stop-color="#E8A83A"/>
    </linearGradient>
  </defs>

  <!-- Background Base Window -->
  <rect width="800" height="500" rx="20" fill="url(#bgPOS)" stroke="#F6C55F" stroke-opacity="0.25" stroke-width="1.5"/>

  <!-- Top System Bar -->
  <rect width="800" height="50" rx="20" fill="#1C110B"/>
  <circle cx="28" cy="25" r="6" fill="#EF4444"/>
  <circle cx="48" cy="25" r="6" fill="#F59E0B"/>
  <circle cx="68" cy="25" r="6" fill="#10B981"/>
  <text x="92" y="29" fill="#9C8573" font-family="system-ui, -apple-system, sans-serif" font-size="12">centralapp.pe/pos · Punto de Venta &amp; Facturación SUNAT</text>

  <rect x="646" y="13" width="130" height="24" rx="12" fill="rgba(34, 197, 94, 0.15)" stroke="#22C55E" stroke-width="1"/>
  <circle cx="662" cy="25" r="4" fill="#22C55E"/>
  <text x="716" y="29" fill="#22C55E" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">SUNAT EN LÍNEA</text>

  <!-- Left Side: Catalog Search & Quick Items -->
  <g transform="translate(24, 66)">
    <!-- Search / Barcode Bar -->
    <rect width="428" height="40" rx="8" fill="#1F120A" stroke="#F6C55F" stroke-opacity="0.2"/>
    <text x="16" y="25" fill="#9C8573" font-family="system-ui, -apple-system, sans-serif" font-size="12">🔍 Escanear código de barras o buscar producto...</text>

    <!-- Price List Selector Pills -->
    <g transform="translate(0, 52)">
      <rect width="96" height="28" rx="14" fill="#F6C55F"/>
      <text x="48" y="18" fill="#140C07" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle">LISTA: LOCAL</text>

      <rect x="104" width="114" height="28" rx="14" fill="#24140C" stroke="#ffffff" stroke-opacity="0.1"/>
      <text x="161" y="18" fill="#D4C3B2" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" text-anchor="middle">APPS DELIVERY</text>

      <rect x="226" width="98" height="28" rx="14" fill="#24140C" stroke="#ffffff" stroke-opacity="0.1"/>
      <text x="275" y="18" fill="#D4C3B2" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" text-anchor="middle">CLIENTE VIP</text>

      <rect x="332" width="96" height="28" rx="14" fill="#24140C" stroke="#ffffff" stroke-opacity="0.1"/>
      <text x="380" y="18" fill="#D4C3B2" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" text-anchor="middle">MAYORISTA</text>
    </g>

    <!-- Product Cards Grid -->
    <g transform="translate(0, 96)">
      <!-- Item 1 -->
      <rect width="134" height="140" rx="10" fill="#24140C" stroke="#F6C55F" stroke-opacity="0.15"/>
      <rect x="10" y="10" width="114" height="54" rx="6" fill="#140C07"/>
      <text x="67" y="43" fill="#F6C55F" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" text-anchor="middle">Pack / Combo</text>
      <text x="12" y="84" fill="#FDFBF7" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700">Box Clásico x6</text>
      <text x="12" y="102" fill="#9C8573" font-family="system-ui, -apple-system, sans-serif" font-size="10">Lista activa: Local</text>
      <text x="12" y="126" fill="#F6C55F" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="800">S/ 42.00</text>

      <!-- Item 2 -->
      <rect x="147" width="134" height="140" rx="10" fill="#24140C" stroke="#F6C55F" stroke-opacity="0.15"/>
      <rect x="157" y="10" width="114" height="54" rx="6" fill="#140C07"/>
      <text x="214" y="43" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" text-anchor="middle">Producto</text>
      <text x="159" y="84" fill="#FDFBF7" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700">Café Grano 500g</text>
      <text x="159" y="102" fill="#9C8573" font-family="system-ui, -apple-system, sans-serif" font-size="10">Lista activa: Local</text>
      <text x="159" y="126" fill="#F6C55F" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="800">S/ 38.50</text>

      <!-- Item 3 -->
      <rect x="294" width="134" height="140" rx="10" fill="#24140C" stroke="#F6C55F" stroke-opacity="0.15"/>
      <rect x="304" y="10" width="114" height="54" rx="6" fill="#140C07"/>
      <text x="361" y="43" fill="#4ADE80" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" text-anchor="middle">Bebida</text>
      <text x="306" y="84" fill="#FDFBF7" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700">Cold Brew 350ml</text>
      <text x="306" y="102" fill="#9C8573" font-family="system-ui, -apple-system, sans-serif" font-size="10">Lista activa: Local</text>
      <text x="306" y="126" fill="#F6C55F" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="800">S/ 12.00</text>
    </g>

    <!-- Bottom Dynamic Price List Info -->
    <g transform="translate(0, 252)">
      <rect width="428" height="62" rx="10" fill="#1A0E08" stroke="#F6C55F" stroke-opacity="0.2"/>
      <text x="16" y="25" fill="#F6C55F" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700">⚡ LISTAS DE PRECIOS DINÁMICAS EN 1 CLIC</text>
      <text x="16" y="45" fill="#D4C3B2" font-family="system-ui, -apple-system, sans-serif" font-size="11">Cambia precios para Local, Apps de Delivery, Clientes o Mayoristas.</text>
    </g>

    <!-- Payment Methods Strip -->
    <g transform="translate(0, 328)">
      <rect width="100" height="32" rx="6" fill="rgba(192, 132, 252, 0.14)" stroke="#C084FC" stroke-opacity="0.3"/>
      <text x="50" y="20" fill="#C084FC" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">YAPE / PLIN</text>

      <rect x="110" width="100" height="32" rx="6" fill="rgba(74, 222, 128, 0.14)" stroke="#4ADE80" stroke-opacity="0.3"/>
      <text x="160" y="20" fill="#4ADE80" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">EFECTIVO</text>

      <rect x="220" width="100" height="32" rx="6" fill="rgba(56, 189, 248, 0.14)" stroke="#38BDF8" stroke-opacity="0.3"/>
      <text x="270" y="20" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">TARJETAS</text>

      <rect x="330" width="98" height="32" rx="6" fill="rgba(246, 197, 95, 0.14)" stroke="#F6C55F" stroke-opacity="0.3"/>
      <text x="379" y="20" fill="#F6C55F" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">CRÉDITO</text>
    </g>
  </g>

  <!-- Right Side: SUNAT Invoice Receipt Panel -->
  <g transform="translate(472, 66)">
    <rect width="304" height="408" rx="12" fill="#1C110B" stroke="#F6C55F" stroke-opacity="0.3"/>
    
    <!-- Header of Invoice (Well separated left and right) -->
    <text x="18" y="28" fill="#FDFBF7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800">FACTURA ELECTRÓNICA</text>
    <text x="286" y="28" fill="#F6C55F" font-family=" monospace" font-size="12" font-weight="700" text-anchor="end">F001-00842</text>
    <line x1="18" y1="40" x2="286" y2="40" stroke="#ffffff" stroke-opacity="0.08"/>

    <!-- Client info -->
    <text x="18" y="60" fill="#9C8573" font-family="system-ui, -apple-system, sans-serif" font-size="10">CLIENTE RUC: 20608945123 · LISTA: LOCAL</text>
    <text x="18" y="76" fill="#FDFBF7" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700">INVERSIONES COMERCIALES S.A.C.</text>

    <!-- Cart items list -->
    <g transform="translate(18, 98)">
      <text x="0" y="14" fill="#D4C3B2" font-family="system-ui, -apple-system, sans-serif" font-size="11">2x Box Clásico x6</text>
      <text x="268" y="14" fill="#FDFBF7" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="end">S/ 84.00</text>

      <text x="0" y="38" fill="#D4C3B2" font-family="system-ui, -apple-system, sans-serif" font-size="11">1x Café Grano 500g</text>
      <text x="268" y="38" fill="#FDFBF7" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="end">S/ 38.50</text>

      <text x="0" y="62" fill="#D4C3B2" font-family="system-ui, -apple-system, sans-serif" font-size="11">2x Cold Brew 350ml</text>
      <text x="268" y="62" fill="#FDFBF7" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="end">S/ 24.00</text>
    </g>

    <!-- Totals & Taxes -->
    <g transform="translate(18, 185)">
      <line x1="0" y1="0" x2="268" y2="0" stroke="#ffffff" stroke-opacity="0.08"/>
      <text x="0" y="20" fill="#9C8573" font-family="system-ui, -apple-system, sans-serif" font-size="11">Op. Gravada:</text>
      <text x="268" y="20" fill="#D4C3B2" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="end">S/ 124.15</text>

      <text x="0" y="38" fill="#9C8573" font-family="system-ui, -apple-system, sans-serif" font-size="11">I.G.V. (18%):</text>
      <text x="268" y="38" fill="#D4C3B2" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="end">S/ 22.35</text>

      <line x1="0" y1="50" x2="268" y2="50" stroke="#F6C55F" stroke-opacity="0.3"/>
      <text x="0" y="74" fill="#FDFBF7" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800">TOTAL A PAGAR:</text>
      <text x="268" y="74" fill="#F6C55F" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" text-anchor="end">S/ 146.50</text>
    </g>

    <!-- QR Code & SUNAT Seal Mockup -->
    <g transform="translate(18, 275)">
      <rect width="44" height="44" rx="4" fill="#FFFFFF"/>
      <rect x="6" y="6" width="12" height="12" fill="#140C07"/>
      <rect x="26" y="6" width="12" height="12" fill="#140C07"/>
      <rect x="6" y="26" width="12" height="12" fill="#140C07"/>
      <rect x="22" y="22" width="6" height="6" fill="#140C07"/>

      <text x="56" y="20" fill="#22C55E" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">✓ VALIDADO POR SUNAT</text>
      <text x="56" y="36" fill="#9C8573" font-family="system-ui, -apple-system, sans-serif" font-size="10">PDF + QR listo para enviar</text>
    </g>

    <!-- Action Button inside card (Fits cleanly inside 268px width) -->
    <g transform="translate(18, 340)">
      <rect width="268" height="44" rx="8" fill="url(#goldPOS)"/>
      <text x="134" y="27" fill="#140C07" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="800" text-anchor="middle">EMITIR Y ENVIAR POR WHATSAPP</text>
    </g>
  </g>
</svg>
