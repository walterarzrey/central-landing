<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" fill="none">
  <defs>
    <linearGradient id="bgCFO" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140C07"/>
      <stop offset="100%" stop-color="#24140C"/>
    </linearGradient>
    <linearGradient id="goldCFO" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6C55F"/>
      <stop offset="100%" stop-color="#E8A83A"/>
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F6C55F" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#F6C55F" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background Base Window -->
  <rect width="800" height="500" rx="20" fill="url(#bgCFO)" stroke="#F6C55F" stroke-opacity="0.25" stroke-width="1.5"/>

  <!-- Top System Bar -->
  <rect width="800" height="50" rx="20" fill="#1C110B"/>
  <circle cx="28" cy="25" r="6" fill="#EF4444"/>
  <circle cx="48" cy="25" r="6" fill="#F59E0B"/>
  <circle cx="68" cy="25" r="6" fill="#10B981"/>
  <text x="96" y="29" fill="#9C8573" font-family="system-ui, -apple-system, sans-serif" font-size="12">centralapp.pe/asesor-ia · Resumen Semanal de tu Negocio</text>

  <!-- Left Column: Health Score + Cost Alert -->
  <g transform="translate(32, 72)">
    <!-- Score Card -->
    <rect width="260" height="234" rx="14" fill="#1C110B" stroke="#F6C55F" stroke-opacity="0.3"/>
    
    <!-- Circle Gauge -->
    <circle cx="130" cy="84" r="48" stroke="#2A1910" stroke-width="8"/>
    <circle cx="130" cy="84" r="48" stroke="url(#goldCFO)" stroke-width="8" stroke-dasharray="301" stroke-dashoffset="32" stroke-linecap="round"/>
    <text x="130" y="88" fill="#F6C55F" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="800" text-anchor="middle">94</text>
    <text x="130" y="105" fill="#9C8573" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">SALUD DEL NEGOCIO</text>

    <text x="130" y="160" fill="#FDFBF7" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" text-anchor="middle">Rentabilidad Óptima</text>
    <text x="130" y="182" fill="#4ADE80" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600" text-anchor="middle">+6.4% vs mes anterior</text>
    <text x="130" y="204" fill="#9C8573" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" text-anchor="middle">Cajas cuadradas sin pérdidas</text>

    <!-- Tactical Alert Below (Multi-line so it fits inside 260px!) -->
    <g transform="translate(0, 250)">
      <rect width="260" height="146" rx="12" fill="#1F120A" stroke="#EF4444" stroke-opacity="0.35"/>
      <rect x="16" y="16" width="124" height="24" rx="6" fill="rgba(239, 68, 68, 0.16)"/>
      <text x="78" y="32" fill="#F87171" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle">⚠️ ALERTA DE COSTO</text>
      
      <text x="16" y="62" fill="#FDFBF7" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">Subida en Proveedor</text>
      <text x="16" y="84" fill="#D4C3B2" font-family="system-ui, -apple-system, sans-serif" font-size="11">El aceite subió +11% en tu</text>
      <text x="16" y="102" fill="#D4C3B2" font-family="system-ui, -apple-system, sans-serif" font-size="11">última factura registrada.</text>
      <text x="16" y="124" fill="#F6C55F" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600">→ Sugerido: Cotizar por mayor</text>
    </g>
  </g>

  <!-- Right Column: Trends Graph & Action Plan -->
  <g transform="translate(312, 72)">
    <!-- Revenue & Margin Chart Card -->
    <rect width="456" height="234" rx="14" fill="#1C110B" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="24" y="32" fill="#FDFBF7" font-family="system-ui, -apple-system, sans-serif" font-size="15.5" font-weight="800">Evolución de tu Ganancia Neta</text>
    <text x="24" y="52" fill="#9C8573" font-family="system-ui, -apple-system, sans-serif" font-size="11">Tus ventas menos compras, mermas y gastos de caja chica.</text>

    <!-- Mini Chart SVG -->
    <g transform="translate(24, 72)">
      <!-- Grid lines -->
      <line x1="0" y1="20" x2="396" y2="20" stroke="#ffffff" stroke-opacity="0.06"/>
      <line x1="0" y1="60" x2="396" y2="60" stroke="#ffffff" stroke-opacity="0.06"/>
      <line x1="0" y1="100" x2="396" y2="100" stroke="#ffffff" stroke-opacity="0.06"/>

      <!-- Area fill -->
      <polygon points="0,108 55,88 115,92 180,58 250,68 320,34 396,16 396,118 0,118" fill="url(#chartGrad)"/>
      
      <!-- Trend line -->
      <polyline points="0,108 55,88 115,92 180,58 250,68 320,34 396,16" stroke="url(#goldCFO)" stroke-width="3" fill="none"/>

      <!-- Pulse Dot on Latest Value -->
      <circle cx="396" cy="16" r="5" fill="#F6C55F"/>
      <circle cx="396" cy="16" r="9" stroke="#F6C55F" stroke-width="1.5" stroke-opacity="0.6"/>

      <!-- Days Labels -->
      <text x="0" y="138" fill="#8E7462" font-family="system-ui, -apple-system, sans-serif" font-size="10">LUN</text>
      <text x="75" y="138" fill="#8E7462" font-family="system-ui, -apple-system, sans-serif" font-size="10">MAR</text>
      <text x="150" y="138" fill="#8E7462" font-family="system-ui, -apple-system, sans-serif" font-size="10">MIÉ</text>
      <text x="225" y="138" fill="#8E7462" font-family="system-ui, -apple-system, sans-serif" font-size="10">JUE</text>
      <text x="300" y="138" fill="#8E7462" font-family="system-ui, -apple-system, sans-serif" font-size="10">VIE</text>
      <text x="396" y="138" fill="#F6C55F" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="end">HOY (+38%)</text>
    </g>

    <!-- Plan Táctico Semanal Generado por IA -->
    <g transform="translate(0, 250)">
      <rect width="456" height="146" rx="12" fill="#1C110B" stroke="#F6C55F" stroke-opacity="0.25"/>
      <text x="20" y="28" fill="#F6C55F" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800">CONSEJOS DE LA IA PARA ESTA SEMANA</text>
      
      <text x="20" y="54" fill="#D4C3B2" font-family="system-ui, -apple-system, sans-serif" font-size="11">1. Reabastecer los 3 productos más vendidos antes del jueves.</text>
      <text x="20" y="78" fill="#D4C3B2" font-family="system-ui, -apple-system, sans-serif" font-size="11">2. Ofrecer promoción por docena o caja en productos de rotación media.</text>
      <text x="20" y="102" fill="#D4C3B2" font-family="system-ui, -apple-system, sans-serif" font-size="11">3. Realizar arqueo ciego al cambio de turno para evitar descuadres.</text>
      <text x="20" y="128" fill="#4ADE80" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">✓ Ganancia extra estimada aplicando consejos: +S/ 1,420</text>
    </g>
  </g>
</svg>
