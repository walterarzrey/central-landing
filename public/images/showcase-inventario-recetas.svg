<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" fill="none">
  <defs>
    <linearGradient id="bgInv" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140C07"/>
      <stop offset="100%" stop-color="#24140C"/>
    </linearGradient>
    <linearGradient id="goldInv" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6C55F"/>
      <stop offset="100%" stop-color="#E8A83A"/>
    </linearGradient>
  </defs>

  <!-- Background Base Window -->
  <rect width="800" height="500" rx="20" fill="url(#bgInv)" stroke="#F6C55F" stroke-opacity="0.25" stroke-width="1.5"/>

  <!-- Top System Bar -->
  <rect width="800" height="50" rx="20" fill="#1C110B"/>
  <circle cx="28" cy="25" r="6" fill="#EF4444"/>
  <circle cx="48" cy="25" r="6" fill="#F59E0B"/>
  <circle cx="68" cy="25" r="6" fill="#10B981"/>
  <text x="96" y="29" fill="#9C8573" font-family="system-ui, -apple-system, sans-serif" font-size="12">centralapp.pe/recetas-y-caja · Recetas Dinámicas, Márgenes y Arqueo Ciego</text>

  <!-- Left: Dynamic Recipes & Profit Margin Control -->
  <g transform="translate(32, 72)">
    <rect width="360" height="396" rx="14" fill="#1C110B" stroke="#F6C55F" stroke-opacity="0.25"/>
    <text x="20" y="30" fill="#FDFBF7" font-family="system-ui, -apple-system, sans-serif" font-size="14.5" font-weight="800">Recetas Dinámicas y Margen Real</text>
    <text x="20" y="48" fill="#9C8573" font-family="system-ui, -apple-system, sans-serif" font-size="11">Calcula tu costo real y descuenta insumos en cada venta</text>

    <!-- Product Header Box -->
    <g transform="translate(20, 64)">
      <rect width="320" height="54" rx="8" fill="#24140C" stroke="#F6C55F" stroke-opacity="0.2"/>
      <text x="14" y="23" fill="#F6C55F" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700">Torta de Chocolate Fudge (Porción)</text>
      <text x="14" y="42" fill="#D4C3B2" font-family="system-ui, -apple-system, sans-serif" font-size="11">Venta: S/ 14.50 · Costo Receta: S/ 4.82</text>
    </g>

    <!-- Ingredients List (3 well-spaced columns inside 320px) -->
    <g transform="translate(20, 136)">
      <!-- Item 1 -->
      <text x="0" y="16" fill="#D4C3B2" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">Harina pastelera</text>
      <text x="210" y="16" fill="#38BDF8" font-family="monospace" font-size="11.5" font-weight="700">-85 gr</text>
      <text x="320" y="16" fill="#D4C3B2" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" text-anchor="end">S/ 0.45</text>

      <!-- Item 2 -->
      <text x="0" y="46" fill="#D4C3B2" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">Cacao en polvo 100%</text>
      <text x="210" y="46" fill="#38BDF8" font-family="monospace" font-size="11.5" font-weight="700">-35 gr</text>
      <text x="320" y="46" fill="#D4C3B2" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" text-anchor="end">S/ 1.10</text>

      <!-- Item 3 -->
      <text x="0" y="76" fill="#D4C3B2" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">Fudge artesanal casero</text>
      <text x="210" y="76" fill="#38BDF8" font-family="monospace" font-size="11.5" font-weight="700">-60 gr</text>
      <text x="320" y="76" fill="#D4C3B2" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" text-anchor="end">S/ 2.20</text>

      <!-- Item 4 -->
      <text x="0" y="106" fill="#D4C3B2" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">Mantequilla sin sal</text>
      <text x="210" y="106" fill="#38BDF8" font-family="monospace" font-size="11.5" font-weight="700">-25 gr</text>
      <text x="320" y="106" fill="#D4C3B2" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" text-anchor="end">S/ 0.85</text>

      <!-- Item 5 -->
      <text x="0" y="136" fill="#D4C3B2" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">Empaque individual</text>
      <text x="210" y="136" fill="#38BDF8" font-family="monospace" font-size="11.5" font-weight="700">-1 un</text>
      <text x="320" y="136" fill="#D4C3B2" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" text-anchor="end">S/ 0.22</text>
    </g>

    <!-- Profit Margin Box (Fits cleanly inside 320px) -->
    <g transform="translate(20, 304)">
      <rect width="320" height="68" rx="8" fill="#140C07" stroke="#4ADE80" stroke-opacity="0.35"/>
      <text x="14" y="26" fill="#FDFBF7" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700">Ganancia Neta por Unidad:</text>
      <text x="306" y="26" fill="#4ADE80" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" text-anchor="end">+S/ 9.68 (67%)</text>
      <text x="14" y="50" fill="#9C8573" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">✓ El margen se recalcula si sube algún ingrediente</text>
    </g>
  </g>

  <!-- Right: Blind Cashier Audit (Arqueo Ciego) -->
  <g transform="translate(408, 72)">
    <rect width="360" height="396" rx="14" fill="#1C110B" stroke="#22C55E" stroke-opacity="0.3"/>
    <text x="20" y="30" fill="#FDFBF7" font-family="system-ui, -apple-system, sans-serif" font-size="14.5" font-weight="800">Arqueo Ciego de Caja Chica</text>
    <text x="20" y="48" fill="#9C8573" font-family="system-ui, -apple-system, sans-serif" font-size="11">El cajero declara el dinero sin ver el saldo previo</text>

    <!-- Audit Status Badge -->
    <g transform="translate(20, 64)">
      <rect width="320" height="40" rx="8" fill="rgba(34, 197, 94, 0.12)" stroke="#22C55E" stroke-width="1"/>
      <circle cx="18" cy="20" r="5" fill="#22C55E"/>
      <text x="32" y="24" fill="#22C55E" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700">TURNO CUADRADO: CERO PÉRDIDAS</text>
    </g>

    <!-- Cash Count Fields -->
    <g transform="translate(20, 122)">
      <text x="0" y="14" fill="#9C8573" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700">DINERO CONTADO POR EL CAJERO:</text>

      <rect y="24" width="320" height="36" rx="6" fill="#140C07" stroke="#ffffff" stroke-opacity="0.08"/>
      <text x="14" y="46" fill="#D4C3B2" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">Efectivo en billetes y monedas:</text>
      <text x="306" y="46" fill="#FDFBF7" font-family="monospace" font-size="12" font-weight="700" text-anchor="end">S/ 482.00</text>

      <rect y="68" width="320" height="36" rx="6" fill="#140C07" stroke="#ffffff" stroke-opacity="0.08"/>
      <text x="14" y="90" fill="#D4C3B2" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">Cobros por Yape y Plin:</text>
      <text x="306" y="90" fill="#FDFBF7" font-family="monospace" font-size="12" font-weight="700" text-anchor="end">S/ 614.50</text>

      <rect y="112" width="320" height="36" rx="6" fill="#140C07" stroke="#ffffff" stroke-opacity="0.08"/>
      <text x="14" y="134" fill="#D4C3B2" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">Vouchers de Tarjetas POS:</text>
      <text x="306" y="134" fill="#FDFBF7" font-family="monospace" font-size="12" font-weight="700" text-anchor="end">S/ 720.00</text>

      <!-- Comparison Result (Well separated left and right!) -->
      <line x1="0" y1="162" x2="320" y2="162" stroke="#ffffff" stroke-opacity="0.1"/>
      <text x="0" y="185" fill="#FDFBF7" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700">Diferencia del Turno:</text>
      <text x="320" y="185" fill="#4ADE80" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="800" text-anchor="end">S/ 0.00 (EXACTO)</text>
    </g>

    <!-- Close Drawer Button (Fits cleanly with 20px bottom margin) -->
    <g transform="translate(20, 330)">
      <rect width="320" height="44" rx="8" fill="url(#goldInv)"/>
      <text x="160" y="27" fill="#140C07" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" text-anchor="middle">CERTIFICAR Y CERRAR CAJA</text>
    </g>
  </g>
</svg>
