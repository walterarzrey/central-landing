<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Matte Dark Container -->
  <rect width="100" height="100" rx="22" fill="#141413" />
  <rect x="2" y="2" width="96" height="96" rx="20" stroke="#2C251D" stroke-width="2" />

  <!-- Outer 'C' Arc -->
  <path
    d="M 49 20 A 32 32 0 1 0 74.8 70.9"
    stroke="#E2AC4E"
    stroke-width="8.4"
    stroke-linecap="round"
  />

  <!-- Left Leg + Crossbar of 'A' -->
  <path
    d="M 61 21.5 L 47 50.5 M 51 42.5 H 73"
    stroke="#E2AC4E"
    stroke-width="8"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Right Leg of 'A' with Concentric Node Gaps & Semicircular Ticket Notch -->
  <path
    d="M 61.4 31.8 A 9.5 9.5 0 0 0 68.6 28.4 L 71.55 34.75 A 4.1 4.1 0 0 0 74.93 42.0 L 77.6 47.7 A 9.5 9.5 0 0 0 70.4 51.1 Z"
    fill="#E2AC4E"
  />

  <!-- 3 Structural AI Nodes at the Vertices of 'A' -->
  <circle cx="61" cy="21.5" r="6.8" fill="#E2AC4E" />
  <circle cx="47" cy="50.5" r="8.6" fill="#E2AC4E" />
  <circle cx="78" cy="58" r="6.8" fill="#E2AC4E" />
</svg>
