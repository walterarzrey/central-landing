<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#100804" />
      <stop offset="50%" stop-color="#1A0F08" />
      <stop offset="100%" stop-color="#24150D" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6C55F" />
      <stop offset="100%" stop-color="#E8A83A" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
  </g>

  <!-- CentralApp Brand Badge (Variation 1B Pure Monoline Logo) -->
  <g transform="translate(100, 90)">
    <rect width="64" height="64" rx="16" fill="#141413" stroke="#E2AC4E" stroke-width="1.5" stroke-opacity="0.3"/>
    <g transform="scale(0.64)">
      <path d="M 49 20 A 32 32 0 1 0 74.8 70.9" stroke="#E2AC4E" stroke-width="8.4" stroke-linecap="round"/>
      <path d="M 61 21.5 L 47 50.5 M 51 42.5 H 73" stroke="#E2AC4E" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 61.4 31.8 A 9.5 9.5 0 0 0 68.6 28.4 L 71.55 34.75 A 4.1 4.1 0 0 0 74.93 42.0 L 77.6 47.7 A 9.5 9.5 0 0 0 70.4 51.1 Z" fill="#E2AC4E"/>
      <circle cx="61" cy="21.5" r="6.8" fill="#E2AC4E"/>
      <circle cx="47" cy="50.5" r="8.6" fill="#E2AC4E"/>
      <circle cx="78" cy="58" r="6.8" fill="#E2AC4E"/>
    </g>
    <text x="80" y="44" fill="#FDFBF7" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="800" letter-spacing="-1">Central<tspan fill="#E2AC4E">App</tspan></text>
  </g>

  <!-- Tagline Badge -->
  <rect x="100" y="190" width="490" height="40" rx="20" fill="#2A1A10" stroke="url(#gold)" stroke-width="1.5" stroke-opacity="0.5"/>
  <text x="125" y="216" fill="#F6C55F" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600">✨ POS · FACTURACIÓN SUNAT · LISTAS DE PRECIOS</text>

  <!-- Main Headline -->
  <text x="100" y="300" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="56" font-weight="800" letter-spacing="-1.5">El Sistema Comercial Inteligente</text>
  <text x="100" y="370" fill="url(#gold)" font-family="system-ui, -apple-system, sans-serif" font-size="56" font-weight="800" letter-spacing="-1.5">con Facturación Electrónica SUNAT</text>

  <!-- Subtitle -->
  <text x="100" y="440" fill="#C9B8A5" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="400">Punto de Venta POS · Registro de Compras con IA · Control de Inventario · Boletas y Facturas</text>

  <!-- Metrics / Features -->
  <g transform="translate(100, 510)">
    <rect width="180" height="52" rx="10" fill="#1C110B" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="90" y="34" fill="#F6C55F" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" text-anchor="middle">SUNAT Oficial</text>

    <rect x="200" width="230" height="52" rx="10" fill="#1C110B" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="315" y="34" fill="#F6C55F" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" text-anchor="middle">Mayorista &amp; Retail</text>

    <rect x="450" width="220" height="52" rx="10" fill="#1C110B" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="560" y="34" fill="#F6C55F" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" text-anchor="middle">Compras con IA</text>

    <rect x="690" width="200" height="52" rx="10" fill="#1C110B" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="790" y="34" fill="#F6C55F" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" text-anchor="middle">100% en la Nube</text>
  </g>
</svg>
